name: Validate modular projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        reference: [document-workbench, data-explorer, engineering-workbench]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - run: python -m pip install -r generator/requirements.txt
      - run: cargo install cargo-generate --version 0.26.0 --locked
      - if: runner.os == 'Linux'
        run: python tools/verify_composed.py --reference ${{ matrix.reference }} --visual --evidence evidence/result.json
      - if: runner.os != 'Linux'
        run: python tools/verify_composed.py --reference ${{ matrix.reference }} --evidence evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ runner.os }}-${{ matrix.reference }}
          path: evidence
  hybrid:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: python -m pip install -r generator/requirements.txt
      - run: cargo install cargo-generate --version 0.26.0 --locked
      - run: python tools/verify_composed.py --hybrid --evidence evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid
          path: evidence
