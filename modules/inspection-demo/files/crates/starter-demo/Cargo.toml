[package]
name = "starter-demo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
starter-reference = { path = "../starter-reference" }
starter-desktop = { path = "../starter-desktop" }
starter-documents = { path = "../starter-documents" }
starter-tasks = { path = "../starter-tasks" }
starter-inspection = { path = "../starter-inspection" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
ui-inspection = ["starter-reference/ui-inspection"]
