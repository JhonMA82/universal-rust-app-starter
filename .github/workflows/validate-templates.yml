name: Validate starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_templates.py
      - run: python3 -m unittest discover -s tests -v
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.26.0 --locked
      - name: Smoke test generated projects (Cargo + Rust toolchain)
        run: python3 tools/verify_templates.py --generate --cargo-check
