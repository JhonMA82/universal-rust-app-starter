name: Validate modular projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        reference: [document-workbench, data-explorer, engineering-workbench]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev mesa-vulkan-drivers xvfb xauth
      - run: python -m pip install -r generator/requirements.txt
      - run: cargo install cargo-generate --version 0.26.0 --locked
      - if: runner.os == 'Linux'
        run: python tools/verify_composed.py --reference ${{ matrix.reference }} --visual --evidence evidence/result.json
      - if: runner.os != 'Linux'
        run: python tools/verify_composed.py --reference ${{ matrix.reference }} --evidence evidence/result.json
      - if: runner.os == 'Linux' && matrix.reference == 'document-workbench'
        run: |
          python -m pip install uv
          uv sync --project templates/desktop-egui
      - if: runner.os == 'Linux' && matrix.reference == 'document-workbench'
        run: xvfb-run -a -s '-screen 0 1280x800x24 -dpi 96' uv run --project templates/desktop-egui --with-requirements generator/requirements.txt python tools/verify_composed.py --reference document-workbench --native-window --evidence evidence/native-window.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ runner.os }}-${{ matrix.reference }}
          path: evidence
  hybrid:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: python -m pip install -r generator/requirements.txt
      - run: cargo install cargo-generate --version 0.26.0 --locked
      - run: python tools/check_docs.py
      - run: python tools/verify_composed.py --ordinary --evidence evidence/ordinary.json
      - run: python tools/verify_composed.py --hybrid --evidence evidence/result.json
      - run: cargo install trunk --version 0.22.2 --locked
      - name: Install Dioxus CLI
        run: |
          mkdir -p "$RUNNER_TEMP/dioxus-cli"
          curl --fail --location --silent --show-error https://github.com/DioxusLabs/dioxus/releases/download/v0.7.3/dx-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP/dioxus-cli"
          echo "$RUNNER_TEMP/dioxus-cli" >> "$GITHUB_PATH"
      - run: python -m pip install playwright==1.58.0 "Pillow>=10,<13"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/verify_browser.py --screenshots evidence/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid
          path: evidence
