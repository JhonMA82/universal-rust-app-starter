[template]
cargo_generate_version = ">=0.21.0"
# Generated caches and the local uv lock must not be scanned for Liquid tags or copied.
ignore = ["__pycache__", "tools/__pycache__", "tests/__pycache__", ".venv", "uv.lock", "target", "examples/eframe-starter/target"]
# Python files contain format specifiers, not Liquid templates.
exclude = ["**/*.py"]
