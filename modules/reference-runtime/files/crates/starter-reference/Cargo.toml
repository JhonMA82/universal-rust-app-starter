[package]
name = "starter-reference"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
starter-core = { path = "../starter-core" }
starter-desktop = { path = "../starter-desktop" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_inspection = { version = "0.37", features = ["plugin"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Document", "Element", "Window"], optional = true }

[features]
ui-inspection = ["dep:egui_inspection"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("mcp", "notes"))'] }

[[example]]
name = "inspection_smoke"
required-features = ["ui-inspection"]

[dev-dependencies]
egui_kittest = "0.37"
